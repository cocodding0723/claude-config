<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf" content="__CSRF_TOKEN__">
<title>문서 모아보기</title>
<style>
/* 토큰: 색은 여기에만 둔다. 보내기만 강조색(--accent)을 쓴다 */
:root{--bg:#fff;--surface:#f6f8fa;--text:#1f2328;--muted:#59636e;--border:#d0d7de;--accent:#0b57d0;--accent-text:#fff;
--ok:#1a7f37;--warn:#9a6700;--error:#cf222e;--hold:#8250df;--row-hover:#eef3fb;--row-sel:#e2ecfb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1117;--surface:#161b22;--text:#e6edf3;--muted:#9198a1;--border:#30363d;
--accent:#4c8dff;--accent-text:#0d1117;--ok:#3fb950;--warn:#d29922;--error:#ff7b72;--hold:#bc8cff;--row-hover:#161f2e;--row-sel:#1b2a42}}
:root[data-theme=dark]{--bg:#0d1117;--surface:#161b22;--text:#e6edf3;--muted:#9198a1;--border:#30363d;
--accent:#4c8dff;--accent-text:#0d1117;--ok:#3fb950;--warn:#d29922;--error:#ff7b72;--hold:#bc8cff;--row-hover:#161f2e;--row-sel:#1b2a42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{font-size:15px;margin:0;white-space:nowrap}
header .sp{flex:1}
#q{width:min(320px,40vw);padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.status{color:var(--muted);font-size:12px}
button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--row-hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button{white-space:nowrap}
button:disabled{opacity:.5;cursor:not-allowed}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border)}
.chip{border-radius:999px;padding:2px 10px;font-size:13px}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip small{opacity:.7;margin-left:4px}
select{font:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
main{flex:1;display:flex;min-height:0}
.list{flex:1;overflow:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--border);z-index:1}
td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--row-hover)}
tbody tr[aria-selected=true]{background:var(--row-sel)}
.thumb{width:88px;height:56px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:4px;background:#fff;overflow:hidden}
.thumb img{max-width:100%;max-height:100%}
.nodia{font-size:11px;color:var(--error);border:1px dashed var(--error);border-radius:4px;padding:2px 4px;text-align:center;line-height:1.2}
.unk{font-size:11px;color:var(--muted)}
.title{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted)}
.did{display:inline-block;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--border);border-radius:4px;padding:0 5px;margin:1px 3px 1px 0;background:var(--bg)}
button.did{cursor:pointer}
.opts{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.opts button{text-align:left;white-space:normal;padding:6px 10px}
.opts button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.say{margin:8px 0 0;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font:12px ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.st-대기{color:var(--warn)}.st-답함{color:var(--ok)}.st-보류{color:var(--hold)}.st-충돌{color:var(--error)}
.sent{font-size:12px;color:var(--ok)}
.viewer{width:55%;border-left:1px solid var(--border);display:none;flex-direction:column;min-width:0}
.viewer.open{display:flex}
.viewer .bar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.viewer .bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer iframe{flex:1;border:0;background:#fff}
dialog{border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);padding:16px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:16px}
dialog label{display:block;margin:10px 0 3px;font-size:12px;color:var(--muted)}
dialog select,dialog textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
dialog textarea{min-height:170px;resize:vertical}
.confirm{margin-top:10px;padding:8px 10px;background:var(--surface);border-radius:6px;font-size:13px}
.err{margin-top:8px;color:var(--error);font-size:13px;min-height:1.2em}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;display:none}
.hint{font-size:11px;color:var(--muted)}
.pane{flex:1;display:flex;flex-direction:column;min-height:0}
.pane[hidden]{display:none}
.tabs{display:flex;gap:4px}
.tabs button[aria-selected=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.check{flex:1;overflow:auto;padding:12px 16px;max-width:980px;width:100%;margin:0 auto}
.check h2{font-size:14px;margin:18px 0 6px;display:flex;gap:8px;align-items:baseline}
.check h2 small{color:var(--muted);font-weight:400}
.item{display:flex;gap:12px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item.done{background:var(--surface);color:var(--muted)}
.item.done .t{font-weight:400;text-decoration:line-through}
.item .basis{color:var(--ok);font-size:12px}
.cmd{display:block;margin-top:4px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font:12px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.links{margin-top:3px;font-size:12px}
.links a,.links button{font-size:12px;padding:0 6px;margin-right:4px}
a.btn{font:inherit;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}
a.btn:hover{background:var(--row-hover)}
.sum{color:var(--muted);font-size:13px}
.notes{color:var(--warn);font-size:12px;margin:6px 0}
@media (max-width:900px){.viewer.open{position:fixed;inset:0;width:100%;background:var(--bg);z-index:5}.col-meta,.col-sent{display:none}.thumb{width:64px;height:44px}}
</style>
<header>
  <h1>문서 모아보기</h1>
  <nav class="tabs" role="tablist" aria-label="화면">
    <button type="button" role="tab" id="tab-check" aria-selected="true">확인 목록 <small id="tab-n"></small></button>
    <button type="button" role="tab" id="tab-docs" aria-selected="false">문서</button>
  </nav>
  <input id="q" type="search" placeholder="제목 검색  ( / )" aria-label="제목 검색" autocomplete="off">
  <span class="sp"></span>
  <span class="status" id="status" role="status"></span>
  <button id="theme" type="button" aria-label="라이트·다크 전환">🌓</button>
</header>
<div class="pane" id="v-check" role="tabpanel" aria-labelledby="tab-check">
  <div class="check" id="check"></div>
</div>
<div class="pane" id="v-docs" role="tabpanel" aria-labelledby="tab-docs" hidden>
<div class="filters">
  <span id="hubs" role="group" aria-label="허브 필터"></span>
  <label class="meta">도식 <select id="f-diagram"><option value="">전체</option><option value="has">있음</option><option value="none">없음</option><option value="unknown">판정 불가</option></select></label>
  <label class="meta">답 상태 <select id="f-answer"><option value="">전체</option><option>대기</option><option>답함</option><option>보류</option><option>충돌</option><option value="없음">결정 없음</option></select></label>
  <label class="meta">보냄 <select id="f-sent"><option value="">전체</option><option value="1">보냄</option><option value="0">안 보냄</option></select></label>
  <span class="hint">↑↓ 이동 · Enter 열기 · S 보내기 · Esc 닫기</span>
</div>
<main>
  <div class="list">
    <table>
      <thead><tr><th>도식</th><th>제목</th><th class="col-meta">결정 · 답 상태</th><th class="col-sent">보냄</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>조건에 맞는 문서가 없음</div>
  </div>
  <section class="viewer" id="viewer" aria-label="문서 열람">
    <div class="bar"><b id="v-title"></b><button id="v-send" class="primary" type="button">보내기</button><button id="v-close" type="button">닫기 Esc</button></div>
    <iframe id="v-frame" sandbox="" title="문서 열람"></iframe>
  </section>
</main>
</div>

<dialog id="dlg" aria-labelledby="dlg-h">
  <h2 id="dlg-h">문서 보내기</h2>
  <div class="confirm" id="dlg-doc"></div>
  <label for="dlg-to">받는 사람</label>
  <select id="dlg-to"></select>
  <label for="dlg-msg">메시지 (고쳐 쓸 수 있음)</label>
  <textarea id="dlg-msg"></textarea>
  <div class="err" id="dlg-err" role="alert"></div>
  <div class="actions"><button id="dlg-cancel" type="button">취소 Esc</button><button id="dlg-ok" class="primary" type="button">확인 후 전송</button></div>
  <div class="hint">누르면 선택한 사람의 Slack DM 으로 문서 파일과 위 메시지가 바로 전송됨</div>
</dialog>
<dialog id="dec" aria-labelledby="dec-h">
  <h2 id="dec-h">결정</h2>
  <div class="confirm" id="dec-title"></div>
  <div class="opts" id="dec-opts" role="group" aria-label="선택지"></div>
  <div id="dec-confirm" hidden>
    <div class="meta" id="dec-target"></div>
    <pre class="say" id="dec-say"></pre>
  </div>
  <div class="err" id="dec-err" role="alert"></div>
  <div class="actions"><button id="dec-cancel" type="button">닫기 Esc</button><button id="dec-ok" class="primary" type="button" disabled>이 답으로 전달</button></div>
  <div class="hint">선택만으로는 전달되지 않음. 위 문구를 확인하고 '이 답으로 전달'을 눌러야 결정을 올린 허브에 전달됨</div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name=csrf]').content;
const $ = (id) => document.getElementById(id);
const state = {hub: "", docs: [], sel: null, sending: null, recipients: [], tab: "check", check: null};

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") e.textContent = v; else if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
}
const pad = (n) => String(n).padStart(2, "0");
function fmt(sec) { const d = new Date(sec * 1000); return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 3500); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ok: false, error: "응답을 읽지 못함"}));
  if (!r.ok) throw new Error(j.error || `요청 실패(${r.status})`);
  return j;
}

function params() {
  const p = new URLSearchParams();
  if (state.hub) p.set("hub", state.hub);
  for (const [k, id] of [["q", "q"], ["diagram", "f-diagram"], ["answer", "f-answer"], ["sent", "f-sent"]]) {
    const v = $(id).value.trim(); if (v) p.set(k, v);
  }
  return p.toString();
}

async function load() {
  try {
    const j = await api("/api/docs?" + params());
    const key = JSON.stringify([j.docs, j.hubs, state.sel]);
    state.docs = j.docs;
    if (key !== state.key) { state.key = key; renderHubs(j.hubs, j.total); renderRows(); }  // 바뀐 게 없으면 다시 그리지 않아 키보드 포커스 유지
    if (state.tab === "docs") $("status").textContent = (j.scanning ? "수집 중… " : "") + `${j.docs.length} / ${j.total}건`;
  } catch (e) {
    if (state.tab === "docs") $("status").textContent = "목록 불러오기 실패: " + e.message;
  }
}

function renderHubs(hubs, total) {
  const box = $("hubs"); box.replaceChildren();
  const mk = (name, label, n) => {
    const b = el("button", {type: "button", class: "chip", "aria-pressed": String(state.hub === name)}, document.createTextNode(label), el("small", {text: n}));
    b.onclick = () => { state.hub = name; load(); };
    box.append(b, " ");
  };
  mk("", "전체", total);
  Object.entries(hubs).sort((a, b) => b[1] - a[1]).forEach(([h, n]) => mk(h, h, n));
}

function renderRows() {
  const tb = $("rows"); tb.replaceChildren();
  $("empty").hidden = state.docs.length > 0;
  for (const d of state.docs) {
    const th = el("div", {class: "thumb"});
    if (d.thumb) th.append(el("img", {src: `/thumb/${d.id}.svg`, alt: "도식 미리보기", loading: "lazy"}));
    else if (d.no_diagram_reason) th.append(el("div", {class: "unk", text: "도식 예외"}));
    else if (d.diagrams === null) th.append(el("div", {class: "unk", text: "판정 불가"}));
    else if (d.diagrams === 0) th.append(el("div", {class: "nodia", text: "도식 없음"}));
    else th.append(el("div", {class: "unk", text: `도식 ${d.diagrams}`}));
    const dec = el("td", {class: "col-meta"});
    if (!d.decisions.length) dec.append(el("span", {class: "meta", text: "결정 없음"}));
    for (const x of d.decisions) {
      const chip = el(x.state === "답함" ? "span" : "button", {class: "did", ...(x.state === "답함" ? {} : {type: "button", title: "선택지 보기·답하기"})}, document.createTextNode(x.id + " "), el("b", {class: "st-" + x.state, text: x.state}));
      if (x.state !== "답함") chip.onclick = (ev) => { ev.stopPropagation(); openDecision(x.id); };
      dec.append(chip);
    }
    const sent = el("td", {class: "col-sent"});
    if (d.sent.length) { const s = d.sent[0]; sent.append(el("div", {class: "sent", text: `보냄 ${fmt(s.at)} → ${s.to}`})); if (d.sent.length > 1) sent.append(el("div", {class: "meta", text: `외 ${d.sent.length - 1}회`})); }
    else sent.append(el("span", {class: "meta", text: "안 보냄"}));
    const btn = el("button", {type: "button", class: "primary", text: "보내기"});
    btn.onclick = (ev) => { ev.stopPropagation(); openSend(d); };
    const tr = el("tr", {tabindex: "0", "aria-selected": String(state.sel === d.id), "data-id": d.id},
      el("td", {}, th),
      el("td", {}, el("div", {class: "title", text: d.title}), el("div", {class: "meta", text: `${fmt(d.mtime)} · ${d.hub}${d.kind ? " · " + d.kind : ""}`})),
      dec, sent, el("td", {}, btn));
    tr.onclick = () => openDoc(d);
    tb.append(tr);
  }
}

function openDoc(d) {
  state.sel = d.id;
  $("v-title").textContent = d.title;
  $("v-frame").src = `/doc/${d.id}`;
  $("viewer").classList.add("open");
  $("v-send").onclick = () => openSend(d);
  document.querySelectorAll("#rows tr").forEach((r) => r.setAttribute("aria-selected", String(r.dataset.id === d.id)));
}
function closeDoc() { state.sel = null; $("viewer").classList.remove("open"); $("v-frame").src = "about:blank"; renderRows(); }

async function openSend(d) {
  state.sending = d;
  $("dlg-err").textContent = ""; $("dlg-msg").value = "초안 불러오는 중…"; $("dlg-ok").disabled = true;
  $("dlg-doc").textContent = `문서: ${d.title}  (${d.hub}, ${fmt(d.mtime)})`;
  const sel = $("dlg-to"); sel.replaceChildren();
  try {
    const [rec, dr] = await Promise.all([api("/api/recipients"), api("/api/draft?id=" + d.id)]);
    state.recipients = rec.recipients;
    if (!rec.recipients.length) $("dlg-err").textContent = "받는 사람 설정이 없음 — ~/.config/lrm-hubs/doc-recipients.json 에 이름과 Slack ID 를 추가";
    rec.recipients.forEach((r) => sel.append(el("option", {value: r.name, text: r.ready ? r.name : `${r.name} (Slack ID 미설정)`, ...(r.ready ? {} : {disabled: ""})})));
    $("dlg-msg").value = dr.message;
    $("dlg-ok").disabled = !rec.recipients.some((r) => r.ready);
    if (rec.recipients.length && !$("dlg-ok").disabled && !rec.recipients[0].ready) sel.value = rec.recipients.find((r) => r.ready).name;
  } catch (e) { $("dlg-err").textContent = "불러오기 실패: " + e.message; $("dlg-msg").value = ""; }
  if (!$("dlg").open) $("dlg").showModal();
  $("dlg-msg").focus();
}

async function confirmSend() {
  const d = state.sending; if (!d) return;
  $("dlg-ok").disabled = true; $("dlg-err").textContent = "";
  try {
    const j = await api("/api/send", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRF-Token": TOKEN},
      body: JSON.stringify({id: d.id, recipient: $("dlg-to").value, message: $("dlg-msg").value})});
    $("dlg").close(); toast(`${j.to}님께 보냄`); load();
  } catch (e) { $("dlg-err").textContent = e.message; $("dlg-ok").disabled = false; }
}

// 결정 답: 선택(preview) → '이 답으로 전달'(commit). 보내는 값은 결정 번호·선택 번호·intent 뿐이고 문구는 서버가 만듦
const decide = {did: "", ts: "", pick: null, intent: ""};
function decPost(body) {
  return api("/api/decide", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRF-Token": TOKEN}, body: JSON.stringify(body)});
}
function decReset() { decide.pick = null; decide.intent = ""; $("dec-confirm").hidden = true; $("dec-ok").disabled = true; $("dec-err").textContent = ""; }
async function openDecision(did, ts) {
  decide.did = did; decide.ts = ts || ""; decReset();
  $("dec-h").textContent = "결정 " + did; $("dec-title").textContent = "불러오는 중…"; $("dec-opts").replaceChildren();
  if (!$("dec").open) $("dec").showModal();
  try {
    const v = await api("/api/decision?id=" + encodeURIComponent(did) + (decide.ts ? "&ts=" + encodeURIComponent(decide.ts) : ""));
    decide.ts = v.ts || decide.ts;
    $("dec-title").textContent = v.title;
    if (v.answered) { $("dec-err").textContent = v.answered + " — 더 답할 수 없음"; return; }
    if (!v.actionable) { $("dec-err").textContent = "감시기 카드는 Slack 에서 답하세요"; return; }
    for (const o of v.options) {
      const b = el("button", {type: "button", "aria-pressed": "false", text: `${o.n}. ${o.text}${v.recommended === o.n ? "  (추천)" : ""}`});
      b.onclick = () => previewPick(o.n, b);
      $("dec-opts").append(b);
    }
  } catch (e) { $("dec-title").textContent = "열 수 없음"; $("dec-err").textContent = "불러오기 실패: " + e.message; }  // 원인 한 줄 + 닫기 버튼은 창에 항상 있음
}
async function previewPick(n, btn) {
  decReset();
  document.querySelectorAll("#dec-opts button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
  try {
    const j = await decPost({id: decide.did, ts: decide.ts, pick: n});
    decide.pick = n; decide.intent = j.intent;
    $("dec-target").textContent = `전달 대상: ${j.target} · ${j.ttl}초 안에 확인`;
    $("dec-say").textContent = j.text;
    $("dec-confirm").hidden = false; $("dec-ok").disabled = false;
  } catch (e) { $("dec-err").textContent = e.message; }
}
async function commitPick() {
  if (!decide.intent) return;
  $("dec-ok").disabled = true; $("dec-err").textContent = "";
  try {
    const j = await decPost({id: decide.did, ts: decide.ts, pick: decide.pick, intent: decide.intent});
    $("dec").close(); toast(j.via === "hub" ? `${j.hub} 허브에 전달함` : "전달함"); load();
  } catch (e) { $("dec-err").textContent = e.message; decReset(); }
}

// ---- 확인 목록(첫 화면): 안 함 먼저 · 종류별 묶음. 줄마다 바로 처리 ----
function setTab(t) {
  state.tab = t;
  for (const n of ["check", "docs"]) { $("v-" + n).hidden = n !== t; $("tab-" + n).setAttribute("aria-selected", String(n === t)); }
  $("q").style.visibility = t === "docs" ? "visible" : "hidden";
  if (t === "docs") load(); else loadCheck();
}
async function loadCheck() {
  try {
    state.check = await api("/api/confirm");
    renderCheck();
    $("status").textContent = state.tab === "check" ? (state.check.scanning ? "수집 중…" : `안 함 ${state.check.todo} · 함 ${state.check.done}`) : $("status").textContent;
  } catch (e) { if (state.tab === "check") $("status").textContent = "확인 목록 불러오기 실패: " + e.message; }
}
function copyText(text, btn) {
  const done = () => { btn.textContent = "복사됨"; setTimeout(() => btn.textContent = "복사", 1500); };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(done, () => toast("복사 실패 — 직접 선택해 복사"));
  else toast("복사 불가 — 직접 선택해 복사");
}
async function approvePr(it, btn) {
  btn.disabled = true;
  toast("확인 창이 Mac 화면에 떴음 — 승인 또는 취소를 누르세요(60초)");
  try {
    const j = await api("/api/approve", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRF-Token": TOKEN}, body: JSON.stringify({id: it.key})});
    toast(j.already ? "이미 승인함·병합 대기" : (j.via === "hub" ? `${j.hub} 허브에 승인 전달함 — 병합 실행은 기존 규칙대로` : "메인에 승인 전달함 — 병합 실행은 기존 규칙대로"));
  } catch (e) { toast(e.message); }
  loadCheck();
}
async function markDone(it, btn) {
  btn.disabled = true;
  try {
    const j = await api("/api/confirm", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRF-Token": TOKEN}, body: JSON.stringify({id: it.key})});
    toast(j.already ? "이미 확인됨" : (j.via === "hub" ? `${j.hub} 허브에 전달함` : "메인에 전달함"));
  } catch (e) { toast(e.message); }
  loadCheck();
}
function openRelated(d) {
  setTab("docs");
  const full = state.docs.find((x) => x.id === d.id) || d;
  openDoc(full);
}
function checkRow(it) {
  const body = el("div", {class: "body"}, el("div", {class: "t", text: it.title}));
  const meta = [it.hub && it.hub !== "미상" ? it.hub + " 허브" : "", it.state === "done" ? "" : it.how].filter(Boolean).join(" · ");
  if (meta) body.append(el("div", {class: "meta", text: meta}));
  if (it.state === "done") body.append(el("div", {class: "basis", text: "✓ " + it.basis}));
  if (it.kind === "command" && it.command && it.state !== "done") body.append(el("code", {class: "cmd", text: it.command}));
  if (it.docs && it.docs.length) {
    const links = el("div", {class: "links"}, document.createTextNode("관련 문서 "));
    for (const d of it.docs) { const b = el("button", {type: "button", text: d.title, title: "문서 열기"}); b.onclick = () => openRelated(d); links.append(b); }
    body.append(links);
  }
  const acts = el("div", {class: "acts"});
  if (it.state !== "done") {
    if (it.kind === "decision") {
      if (it.ts) { const b = el("button", {type: "button", class: "primary", text: "답하기"}); b.onclick = () => openDecision(it.did, it.ts); acts.append(b); }
      else acts.append(el("span", {class: "meta", text: "카드 없음 — Slack/허브로 답" + (it.hub && it.hub !== "미상" ? " · " + it.hub + " 허브" : "")}));
    }
    else if (it.kind === "merge") {
      if (it.url) acts.append(el("a", {class: "btn primary", href: it.url, target: "_blank", rel: "noopener noreferrer", text: "PR 열기"}));
      if (it.approved) acts.append(el("span", {class: "basis", text: "✓ 승인함·병합 대기"}));
      else { const b = el("button", {type: "button", text: "병합 승인", title: "Mac 확인 창에서 승인하면 담당 허브에 전달. 병합 실행은 기존 규칙대로(dev/main 병합은 사용자가 직접)"}); b.onclick = () => approvePr(it, b); acts.append(b); }
    }
    else {
      if (it.kind === "command" && it.command) { const c = el("button", {type: "button", text: "복사"}); c.onclick = () => copyText(it.command, c); acts.append(c); }
      const b = el("button", {type: "button", class: "primary", text: "했음", title: "확인 기록을 남기고 담당 허브에 한 줄 전달"}); b.onclick = () => markDone(it, b); acts.append(b);
    }
  }
  return el("div", {class: "item" + (it.state === "done" ? " done" : ""), "data-key": it.key}, body, acts);
}
function renderCheck() {
  const c = state.check, box = $("check"); box.replaceChildren();
  $("tab-n").textContent = c.todo ? `(${c.todo})` : "";
  box.append(el("div", {class: "sum", text: c.scanning ? "수집 중…" : `내가 확인할 것 ${c.todo}건 안 함 · ${c.done}건 함`}));
  for (const n of c.notes) box.append(el("div", {class: "notes", text: "⚠ " + n}));
  const todo = c.items.filter((i) => i.state !== "done"), done = c.items.filter((i) => i.state === "done");
  if (!todo.length && !c.scanning) box.append(el("div", {class: "empty", text: "확인할 것 없음"}));
  for (const k of c.kinds) {
    const rows = todo.filter((i) => i.kind === k.kind);
    if (!rows.length) continue;
    box.append(el("h2", {}, document.createTextNode(k.label), el("small", {text: `${rows.length}건`})));
    rows.forEach((i) => box.append(checkRow(i)));
  }
  if (done.length) {
    box.append(el("h2", {}, document.createTextNode("✅ 함"), el("small", {text: `${done.length}건`})));
    done.forEach((i) => box.append(checkRow(i)));
  }
}
$("tab-check").onclick = () => setTab("check");
$("tab-docs").onclick = () => setTab("docs");

$("dec-ok").onclick = commitPick;
$("dec-cancel").onclick = () => $("dec").close();

$("dlg-ok").onclick = confirmSend;
$("dlg-cancel").onclick = () => $("dlg").close();
$("v-close").onclick = closeDoc;
let timer; $("q").oninput = () => { clearTimeout(timer); timer = setTimeout(load, 200); };
for (const id of ["f-diagram", "f-answer", "f-sent"]) $(id).onchange = load;
$("theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("theme", r.dataset.theme); } catch (e) {} };
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

document.addEventListener("keydown", (ev) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  const modal = $("dlg").open || $("dec").open;
  if (ev.key === "/" && !typing) { ev.preventDefault(); $("q").focus(); }
  else if (ev.key === "Escape" && !modal) { if (typing) document.activeElement.blur(); else closeDoc(); }
  else if (!typing && !modal && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
    const rows = [...document.querySelectorAll("#rows tr")]; const i = rows.indexOf(document.activeElement.closest("tr"));
    const n = rows[Math.max(0, Math.min(rows.length - 1, i + (ev.key === "ArrowDown" ? 1 : -1)))]; if (n) { ev.preventDefault(); n.focus(); }
  } else if (!typing && !modal && ev.key === "Enter") { const tr = document.activeElement.closest && document.activeElement.closest("#rows tr"); if (tr && document.activeElement === tr) tr.click(); }
  else if (!typing && !modal && (ev.key === "s" || ev.key === "S")) { const tr = document.activeElement.closest && document.activeElement.closest("#rows tr"); if (tr) tr.querySelector("button.primary").click(); }
});

// 주소 조각으로 바로 열기: #open=<id> 열람, #send=<id> 보내기 창(확인 전까지 전송 없음)
const hashOpen = location.hash.match(/^#(open|send)=([0-9a-f]{12})$/);
if (hashOpen) setTab("docs"); else setTab("check");
load().then(() => {
  const d = hashOpen && state.docs.find((x) => x.id === hashOpen[2]);
  if (d) (hashOpen[1] === "open" ? openDoc : openSend)(d);
});
setInterval(() => { if (!$("dlg").open && !$("dec").open) (state.tab === "docs" ? load : loadCheck)(); }, 30000);
</script>
</html>
