.cimg{width:22px;height:auto}.mute{color:var(--mute);font-size:13px}

ul{padding-left:18px}code{font-size:12px}

</style></head><body><main>
<h1>🕯️ PR #521 고해실</h1>
<div class="mute" style="color:#cdb894">코드 덩어리가 고해하러 온다. 빈칸에 맞는 단어 카드를 끼워라. 틀려도 감점 없음. <button class="pill" id="mute">🔊</button></div>

</main>
<div class="veil" id="pause"><div class="box" style="max-width:300px;text-align:center"><b>멈춤</b><p class="mute">촛불이 잠시 멈췄다.</p><button class="btn main" id="resume">계속</button></div></div>
<script>const PR={num:521,url:"https://github.com/Basakansoft/LoveRevolutionMaker/pull/521",intro:"게임 코드에 남은 Debug.Log 4곳을 LogEngine 으로 바꾼다. 저장소 규칙(게임 코드는 LogEngine 사용)과 어긋나 있었다.",term:"LogEngine = 이 프로젝트 공용 로거. 기능 이름 태그로 로그를 골라 본다."};
// 근거: PR 본문·커밋 fe84a5b7·diff·IngameSession.cs 7행·Assets/csc.rsp 1행
const G=[
{face:"🧑‍🏫",file:"TutorialCoachTarget.cs",boss:true,
easy:"잘못된 튜토리얼 키를 넣으면 에디터가 경고를 띄우는 검사. 그 경고 방식을 바꿨다.",term:"OnValidate = 인스펙터 값이 바뀔 때 에디터가 부르는 함수",
code:[" private void OnValidate()"," {","     if (tutorialCoachKey == TutorialCoachKey.TemporaryConsumedKey)","     {",'-        Debug.LogError("... 임시 소비용 키입니다. ...", this);','+        LogEngine.LogError($"{gameObject.name}: ... 임시 소비용 키입니다. ...",',"+            nameof(TutorialCoachTarget));","         tutorialCoachKey = TutorialCoachKey.None;","     }"," }"],
say:"이제 경고는 [LogEngine.LogError] 함수가 찍어요. 메시지 맨 앞에는 [gameObject.name] 값이 붙어요.",
ans:[["LogEngine.LogError"],["gameObject.name"]],decoy:["EditorPrefs","Stopwatch","throw"],hint:[5],tut:0,
risk:{q:"this 인자가 빠지며 잃는 기능(콘솔 클릭 → 오브젝트 하이라이트)은 어느 줄?",cand:[4,5,7],lines:[4],why:"삭제 줄의 this = 콘솔 클릭 시 오브젝트 하이라이트 context. 새 호출은 기능 이름 문자열만 받음."},
why:"PR 본문: 에디터 검사 오류를 LogEngine.LogError 로. 오브젝트 이름을 메시지에 넣음."},
{face:"🧙",file:"StoryDevModeEditor.cs",
easy:"에디터 메뉴로 '개발 중 스토리 보기'를 켜고 끄는 버튼. 켰다/껐다 안내 로그를 바꿨다.",term:"EditorPrefs = 에디터 PC 에만 저장되는 설정 값",
code:[" #if UNITY_EDITOR","+using Core.LoggerModule;"," ..."," var next = !EditorPrefs.GetBool(ShowInDevelopmentPrefKey, false);"," EditorPrefs.SetBool(ShowInDevelopmentPrefKey, next);",'-Debug.Log($"[StoryDevMode] 개발 중 스토리 표시 = {next} · ...");','+LogEngine.Log($"개발 중 스토리 표시 = {next} · ...", "StoryStage");'],
say:"로그 태그는 새로 만들지 않고 기존 [StoryStage] 태그를 썼어요.",
ans:[["StoryStage"]],decoy:["Stopwatch","OnValidate"],hint:[6],
why:"PR 본문: 개발용 안내를 LogEngine.Log 로. 기존 기능 이름 사용."},
{face:"🧭",file:"LocationJsonProvider.cs",
easy:"위치 데이터 파일을 못 읽으면 오류를 남기는 곳. 같은 오류가 두 번 찍히던 걸 한 번으로.",term:"csc.rsp = 프로젝트 전체 컴파일 설정 파일",
code:["     LogEngine.LogError(",'         $"Failed to load JSON: {ex}",','         "LocationJsonProvider"',"     );","-#if UNITY_EDITOR",'-    Debug.LogError($"[LocationJsonProvider] Failed to load JSON: {ex}");',"-#endif","     throw;"],
say:"지운 줄은 겹쳐 찍던 [Debug.LogError] 호출이에요. 에디터 출력은 [LOGENGINE_ENABLE] 설정이 지켜요.",
ans:[["Debug.LogError"],["LOGENGINE_ENABLE"]],decoy:["gameObject.name","StoryStage"],hint:[5],
why:"PR 검증 절: Assets/csc.rsp 가 LOGENGINE_ENABLE 을 전역 정의 → 에디터 콘솔 출력 유지. throw; 는 그대로."},
{face:"⏱️",file:"IngameSession.cs",
easy:"인게임 들어갈 때 구간별 걸린 시간을 찍는 개발용 타이머. 로그 태그만 바꿨다.",term:"Lap = 구간 기록 한 번",
code:[" private static readonly Stopwatch _sw = new();"," private static void Lap(string label)"," {",'-    UnityEngine.Debug.Log($"[IngameTimer] {label}: {_sw.ElapsedMilliseconds}ms");','+    LogEngine.Log($"{label}: {_sw.ElapsedMilliseconds}ms", "IngameSession");'," }"," #endif"],
say:"타이머 로그는 이제 [IngameSession] 태그로 찾아요.",
ans:[["IngameSession"]],decoy:["LOGENGINE_ENABLE","EditorPrefs"],hint:[4],
why:"PR 본문: 개발용 타이머를 LogEngine.Log 로. 기존 기능 이름 사용. using Core.LoggerModule 은 7행에 이미 있음."}];
const T=60,HINT=10,SWIFT=20,KEY="prgame-"+PR.num;
let st,tick,paused=false,mode="easy",muted=false;
const SFX={card:"{{S_CARD}}",ok:"{{S_OK}}",no:"{{S_NO}}",burn:"{{S_BURN}}"};
function sfx(k){if(muted)return;try{const a=new Audio(SFX[k]);a.volume=.5;a.play().catch(()=>{})}catch(e){}}
const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function best(v){try{if(v!=null)localStorage.setItem(KEY,Math.max(v,+localStorage.getItem(KEY)||0));return +localStorage.getItem(KEY)||0}catch(e){return 0}}
function lobby(){$("app").innerHTML=`<div class="box"><b>이 PR 은</b> ${esc(PR.intro)}<div class="mute">${esc(PR.term)}</div>
<p class="mute" style="margin-top:10px">손님 ${G.length}명 · 빈칸에 카드 끼우기 · 💡힌트 언제든 · 틀려도 감점 없이 정답 보고 다음 · ${SWIFT}초 안에 풀면 ⚡신속 보너스 · 👾손님은 후보 3줄 중 위험 줄 고르면 🗡️날카로움<br>카드는 끌어다 놓거나, 카드 → 빈칸 순서로 탭.</p>
<div class="seg"><button class="btn on" data-m="easy">쉬움</button><button class="btn" data-m="normal">보통</button></div>
<div class="mute" id="mdesc">쉬움: 오답 카드 2장, 이전 정답 카드 안 섞임</div>
<p></p><div class="mute">💻 Slack 미리보기에서는 동작하지 않는다. 파일을 내려받아 PC 브라우저(Chrome·Safari)로 열 것.</div><p></p><input id="who" placeholder="고해 신부 이름 (리뷰어)"><p></p><button class="btn main" id="go">문 열기</button> <span class="mute">최고 ${best()}점</span></div>`;
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));$("mdesc").textContent=mode=="easy"?"쉬움: 오답 카드 2장, 이전 정답 카드 안 섞임":"보통: 오답 카드 전부 + 이전 손님 정답 카드가 섞임"});
$("go").onclick=()=>{st={name:($("who").value||"익명").trim(),i:0,score:0,ok:0,miss:[],memo:{},carry:[],swift:0,sharp:0,t0:Date.now()};guest()}}
function guest(){
 if(st.i>=G.length)return scroll();
 const g=G[st.i],dec=mode=="easy"?g.decoy.slice(0,2):[...g.decoy,...st.carry];
 const words=[...new Set([...g.ans.map(a=>a[0]),...dec])].sort(()=>Math.random()-.5);
 let k=0;const say=esc(g.say).replace(/\[([^\]]+)\]/g,()=>`<span class="slot" data-k="${k++}"></span>`);
 $("app").innerHTML=`<div class="top"><div class="candle"><img class="cimg" alt="" src="data:image/png;base64,{{CANDLE}}"><div class="wax"><i id="wax" style="width:100%"></i></div></div><span class="pill" id="sc">${st.score}점</span><button class="pill" id="pz">⏸</button></div>
<div class="box"><div class="who"><span class="face">${g.face}</span><div><div class="mute">손님 ${st.i+1}/${G.length} · <code>${g.file}</code></div>${g.boss?'<div class="boss">👾 위험 손님 · 날카로움 보너스</div>':""}</div></div>
<div class="easy">🔎 이 코드가 하는 일: ${esc(g.easy)}</div><div class="mute" style="margin-top:4px">용어 · ${esc(g.term)}</div>
${g.tut!=null?'<div class="fb" style="color:var(--gold)">🎓 연습: 첫 칸은 미리 끼워 뒀다. 남은 칸에 카드를 끼우고 "고해 받기".</div>':""}
<div class="say">${say}</div><div class="hand">${words.map(w=>`<span class="cardw${st.carry.includes(w)&&mode!="easy"?" carry":""}">${esc(w)}</span>`).join("")}</div>
<pre id="code">${g.code.map(l=>`<div class="${l[0]=="+"?"a":l[0]=="-"?"d":""}">${esc(l)}</div>`).join("")}</pre>
<div class="fb" id="fb"></div><div class="row" id="acts"><button class="btn main" id="sub">고해 받기</button><button class="btn" id="hintb">💡 힌트</button><button class="btn" id="burn">⏭ 모르겠음·건너뛰기</button></div><div class="mute" id="need"></div>
<p class="mute" style="margin:12px 0 4px">💬 작성자에게 질문 메모</p><textarea id="memo" rows="2">${esc(st.memo[st.i]||"")}</textarea></div>`;
 $("memo").oninput=e=>st.memo[st.i]=e.target.value;$("pz").onclick=()=>{paused=true;$("pause").classList.add("on")};
 const slots=[...document.querySelectorAll(".slot")],cards=[...document.querySelectorAll(".cardw")];let sel=null;
 const put=(s,c)=>{if(s.dataset.c)cards[s.dataset.c].classList.remove("used");s.textContent=c.textContent;s.dataset.c=cards.indexOf(c);s.classList.add("f");s.classList.remove("no","ok","pre");c.classList.add("used");c.classList.remove("sel");sel=null;sfx("card");need()};
 const need=()=>{const e=$("need");if(!e)return;const r=slots.filter(x=>!x.dataset.c).length;e.textContent=r?`👉 넘어가려면: 빈칸 ${r}개를 채우고 "고해 받기". 막히면 💡힌트나 ⏭건너뛰기.`:`👉 다 채웠다. "고해 받기"를 누른다.`};
 if(g.tut!=null){const c=cards.find(x=>x.textContent===g.ans[g.tut][0]);put(slots[g.tut],c)}
 slots.forEach(s=>s.onclick=()=>{if(sel)put(s,sel);else if(s.dataset.c){cards[s.dataset.c].classList.remove("used");delete s.dataset.c;s.textContent="";s.classList.remove("f","ok","no");need()}});need();
 cards.forEach(c=>{c.onpointerdown=e=>{if(c.classList.contains("used"))return;const sx=e.clientX,sy=e.clientY;let gh=null;
  const mv=ev=>{if(!gh&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){gh=c.cloneNode(true);gh.classList.add("drag");document.body.appendChild(gh)}if(gh){gh.style.left=ev.clientX-20+"px";gh.style.top=ev.clientY-16+"px"}};
  const up=ev=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);if(gh){gh.remove();const t=document.elementFromPoint(ev.clientX,ev.clientY);if(t&&t.classList.contains("slot"))put(t,c)}else{cards.forEach(x=>x.classList.remove("sel"));sel=sel===c?null:c;if(sel)c.classList.add("sel")}};
  addEventListener("pointermove",mv);addEventListener("pointerup",up)}});
 let hinted=false,left=T;const t1=Date.now();
 const hint=()=>{if(hinted)return;hinted=true;const pre=$("code").children;g.hint.forEach(n=>pre[n].classList.add("h"));slots.forEach((s,n)=>{if(!s.dataset.c){s.textContent=g.ans[n][0][0]+"…";s.classList.add("pre")}});$("fb").innerHTML="💡 노란 줄을 보고, 빈칸의 첫 글자를 따라가라."};
 $("hintb").onclick=hint;clearInterval(tick);
 tick=setInterval(()=>{if(paused)return;left=Math.max(5,left-.25);$("wax").style.width=left/T*100+"%";if((Date.now()-t1)/1000>=HINT)hint()},250);
 $("sub").onclick=()=>{clearInterval(tick);let all=true;slots.forEach((s,n)=>{const ok=g.ans[n].includes(s.textContent);if(!ok){all=false;s.classList.add("no");s.textContent=g.ans[n][0]}else s.classList.add("ok")});
  $("acts").remove();$("need").remove();const sec=(Date.now()-t1)/1000;let pts=0;const ex=[];
  sfx(all?"ok":"no");if(all){pts=100;st.ok++;if(sec<=SWIFT){pts+=50;st.swift++;ex.push("⚡신속 +50")}}else st.miss.push(`${g.file} — ${g.say.replace(/\[|\]/g,"")}`);
  st.carry=g.ans.map(a=>a[0]);
  const head=all?`<b class="ok">사함 +${pts}</b> ${ex.join(" ")}`:`<b class="no">아깝다.</b> 정답을 채워 뒀다(감점 없음).`;
  st.score+=pts;$("sc").textContent=st.score+"점";$("fb").innerHTML=`${head}<br>${esc(g.why)}`;
  if(g.risk){const pre=$("code"),rows=[...pre.children],bonus=document.createElement("div");bonus.className="fb";bonus.id="bonus";bonus.innerHTML=`🗡️ 선택 보너스: ${esc(g.risk.q)} <span class='mute'>(점선 3줄 중 하나를 누른다. 안 해도 다음으로 갈 수 있다)</span>`;$("fb").after(bonus);
   g.risk.cand.forEach(n=>{rows[n].classList.add("cand");rows[n].onclick=()=>{if(pre.dataset.d)return;pre.dataset.d=1;rows.forEach(r=>r.classList.remove("cand"));const ok=g.risk.lines.includes(n);rows[n].classList.add(ok?"hit":"miss");g.risk.lines.forEach(L=>rows[L].classList.add("hit"));if(ok){st.score+=50;st.sharp++;$("sc").textContent=st.score+"점"}bonus.innerHTML=(ok?"🗡️ 날카로움 +50. ":"🗡️ 정답은 초록 줄. ")+esc(g.risk.why)}})}
  next()};
 $("burn").onclick=()=>{clearInterval(tick);sfx("burn");st.miss.push(`${g.file} — ${g.say.replace(/\[|\]/g,"")}`);st.carry=g.ans.map(a=>a[0]);slots.forEach((s,n)=>{s.textContent=g.ans[n][0];s.classList.add("f")});$("acts").remove();$("need").remove();$("fb").innerHTML=`🔥 넘김. 정답을 채워 뒀다.<br>${esc(g.why)}`;next()};
 function next(){if($("next"))return;const b=document.createElement("button");b.className="btn main";b.id="next";b.style.marginTop="10px";b.textContent=st.i+1<G.length?"다음 손님 →":"두루마리 펼치기";b.onclick=()=>{st.i++;guest();scrollTo(0,0)};($("bonus")||$("fb")).after(b);const t=document.createElement("div");t.className="mute";t.textContent="👉 아래 버튼을 누르면 다음 손님으로 넘어간다.";b.before(t)}
}
function scroll(){
 const pct=Math.round(st.ok/G.length*100),sec=Math.round((Date.now()-st.t0)/1000);best(st.score);
 const memos=Object.entries(st.memo).filter(([,v])=>v.trim()).map(([k,v])=>`- [${G[k].file}] ${v.trim()}`);
 const txt=`[PR #${PR.num} 고해실] ${st.name} · ${mode=="easy"?"쉬움":"보통"} · ${st.score}점 · 이해도 ${pct}% · ${sec}초
신속 ${st.swift} · 날카로움 ${st.sharp}/${G.filter(g=>g.risk).length}
놓친 곳: ${st.miss.length?"\n"+st.miss.map(b=>"- "+b).join("\n"):"없음"}${memos.length?"\n작성자에게 질문:\n"+memos.join("\n"):""}
${PR.url}`;
 $("app").innerHTML=`<div class="box scroll" id="result"><div class="mute">📜 고해 기록</div><div class="big">${pct}%</div><div>${esc(st.name)} · ${st.score}점 · ${sec}초 · 최고 ${best()}점</div>
<p>⚡신속 ${st.swift} · 🗡️날카로움 ${st.sharp} · 놓침 ${st.miss.length}</p>
<b>놓친 곳 = 작성자에게 물어볼 곳</b><ul>${st.miss.length?st.miss.map(b=>"<li>"+esc(b)+"</li>").join(""):"<li>없음</li>"}</ul>
<b>Slack·PR 댓글용</b><textarea id="out" rows="8">${esc(txt)}</textarea><p></p>
<button class="btn main" id="cp">복사</button> <button class="btn" id="re">다시</button></div>`;
 $("cp").onclick=()=>{const t=$("out");(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>$("cp").textContent="복사됨",()=>{t.select();document.execCommand("copy");$("cp").textContent="복사됨"})};
 $("re").onclick=lobby}
$("resume").onclick=()=>{paused=false;$("pause").classList.remove("on")};
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊"};
lobby();
if(location.hash==="#demo"){$("go").click()}
</script></body></html>
